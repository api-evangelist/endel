aid: endel
name: Endel
description: >-
  Endel is a wellness technology company that generates personalized, adaptive
  soundscapes to help people focus, relax, sleep, and stay active. Its patented
  technology creates endless real-time audio that responds to inputs such as
  time of day, weather, circadian rhythm, heart rate, and location, delivered
  across iOS, Android, macOS, Windows, web, Apple Watch, Apple TV, Amazon Fire
  TV, and Alexa. Endel is a consumer application; as of this profile it does not
  publish a public developer API, SDK, or OpenAPI surface, so this repo captures
  its identity and public web properties rather than API artifacts.
